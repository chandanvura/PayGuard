---
- name: Verify PayGuard local platform
  hosts: local
  gather_facts: false

  vars:
    payguard_namespace: payguard
    payment_deployment: payment-service
    postgres_deployment: postgres

  tasks:
    - name: Check kubectl availability
      ansible.builtin.command:
        cmd: kubectl version --client
      changed_when: false

    - name: Check Minikube status
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: minikube_status
      changed_when: false

    - name: Verify PayGuard namespace
      ansible.builtin.command:
        cmd: kubectl get namespace {{ payguard_namespace }}
      changed_when: false

    - name: Verify payment-service rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/{{ payment_deployment }} -n {{ payguard_namespace }} --timeout=60s
      changed_when: false

    - name: Verify PostgreSQL rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/{{ postgres_deployment }} -n {{ payguard_namespace }} --timeout=60s
      changed_when: false

    - name: Verify PostgreSQL PVC
      ansible.builtin.command:
        cmd: kubectl get pvc postgres-data -n {{ payguard_namespace }}
      register: pvc_status
      changed_when: false

    - name: Verify application pods
      ansible.builtin.command:
        cmd: kubectl get pods -n {{ payguard_namespace }}
      register: pod_status
      changed_when: false

    - name: Display PayGuard pod status
      ansible.builtin.debug:
        var: pod_status.stdout_lines

    - name: Display PostgreSQL PVC status
      ansible.builtin.debug:
        var: pvc_status.stdout_lines
