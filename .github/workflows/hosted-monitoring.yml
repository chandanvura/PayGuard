name: Hosted monitoring capture
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/export-monitoring.py'
      - 'scripts/capture-grafana.mjs'
      - '.github/workflows/hosted-monitoring.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  capture-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t payguard-payment-service:local ./payment-service
      - name: Start observability stack
        run: |
          printf 'POSTGRES_DB=payguard\nPOSTGRES_USER=payguard\nPOSTGRES_PASSWORD=runner_only_password\nGRAFANA_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          chmod 600 .env
          docker compose -f docker-compose.yml -f docker-compose.hosted.yml up -d postgres payment-service prometheus loki grafana
      - name: Exercise live payment recovery
        env:
          PAYGUARD_EVIDENCE: site-output/observability/latest/demo-evidence.md
        run: |
          mkdir -p site-output/observability/latest
          python3 scripts/ci-demo.py
      - name: Export real Prometheus query results
        run: python3 scripts/export-monitoring.py
      - name: Capture real Grafana dashboard
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null; then export CHROME_PATH="$(command -v google-chrome)"; else npx playwright install chromium; fi
          node scripts/capture-grafana.mjs
      - name: Assemble site
        run: cp -a website/. site-output/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-output
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-monitoring-evidence
          path: site-output/observability/latest/
          if-no-files-found: warn
          retention-days: 30
      - name: Show logs if capture fails
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml logs --tail=100 payment-service prometheus grafana
