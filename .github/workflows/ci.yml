name: PayGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Java Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: payguard
          POSTGRES_USER: payguard_ci
          POSTGRES_PASSWORD: payguard_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payguard_ci -d payguard"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: payment-service

    env:
      DB_URL: jdbc:postgresql://localhost:5432/payguard
      DB_USERNAME: payguard_ci
      DB_PASSWORD: payguard_ci_test_only
      FAILURE_SIMULATION_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: payment-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode clean test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build payment-service image
        run: docker build -t payguard-payment-service:ci ./payment-service

      - name: Build Go sidecar image
        run: docker build -t payguard-sidecar:ci ./sidecar

  sidecar:
    name: Go Sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
      - run: cd sidecar && go test ./... && go vet ./...

  kubernetes:
    name: Kubernetes Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary \
            kubernetes/namespace.yaml \
            kubernetes/configmap.yaml \
            kubernetes/secret.example.yaml \
            kubernetes/postgres/pvc.yaml \
            kubernetes/postgres/deployment.yaml \
            kubernetes/postgres/service.yaml \
            kubernetes/payment-service/deployment.yaml \
            kubernetes/payment-service/service.yaml
