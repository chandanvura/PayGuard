name: PayGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI_POSTGRES_DB: payguard
  CI_POSTGRES_USER: payguard_ci
  CI_POSTGRES_PASSWORD: payguard_ci_test_only

jobs:
  test:
    name: Java Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payguard_ci -d payguard"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: payment-service

    env:
      DB_URL: jdbc:postgresql://localhost:5432/${{ env.CI_POSTGRES_DB }}
      DB_USERNAME: ${{ env.CI_POSTGRES_USER }}
      DB_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
      FAILURE_SIMULATION_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: payment-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode clean test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build payment-service image
        run: docker build -t payguard-payment-service:ci ./payment-service

  kubernetes:
    name: Kubernetes Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/namespace.yaml
          kubectl apply --dry-run=client -f kubernetes/configmap.yaml
          kubectl apply --dry-run=client -f kubernetes/secret.example.yaml
          kubectl apply --dry-run=client -f kubernetes/postgres/pvc.yaml
          kubectl apply --dry-run=client -f kubernetes/postgres/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/postgres/service.yaml
          kubectl apply --dry-run=client -f kubernetes/payment-service/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/payment-service/service.yaml



