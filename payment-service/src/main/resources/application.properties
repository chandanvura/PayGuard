spring.application.name=payment-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/payguard}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted

management.metrics.tags.application=${spring.application.name}

# HTTP latency histogram for Prometheus percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# SLO latency boundaries
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s

# Payment reconciliation
payguard.reconciliation.delay-ms=10000

# Controlled failure simulation for local SLO testing
payguard.failure-simulation.enabled=${FAILURE_SIMULATION_ENABLED:false}
